version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    groups:
      cargo:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 30

  - package-ecosystem: "github-actions"
    directory: "/"
    groups:
      github-actions:
        patterns: ["*"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
